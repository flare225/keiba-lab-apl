name: App production smoke

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: app-production-smoke
  cancel-in-progress: true

env:
  PRODUCTION_URL: https://keiba-lab-apl.vercel.app

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Resolve expected app version
        id: expected
        shell: bash
        run: |
          set -euo pipefail
          entry="$(node - <<'NODE'
          const fs=require('fs');
          const x=fs.readFileSync('wrangler.jsonc','utf8');
          const m=x.match(/"main"\s*:\s*"src\/index-v([^"]+)\.js"/);
          if(!m)process.exit(2);
          process.stdout.write(m[1]);
          NODE
          )"
          echo "version=$entry" >> "$GITHUB_OUTPUT"
      - name: Verify deployed browser root
        shell: bash
        env:
          EXPECTED_VERSION: ${{ steps.expected.outputs.version }}
        run: |
          set -euo pipefail
          last=''
          for attempt in $(seq 1 24); do
            health="$(curl -fsS --max-time 10 "$PRODUCTION_URL/health" 2>/dev/null || true)"
            html="$(curl -fsS --max-time 10 "$PRODUCTION_URL/" 2>/dev/null || true)"
            last="$health"
            actual="$(printf '%s' "$health" | jq -r '.version // empty' 2>/dev/null || true)"
            readable="$(printf '%s' "$health" | jq -r '.features | index("touch-friendly-global-styles") // empty' 2>/dev/null || true)"
            preview="$(printf '%s' "$health" | jq -r '.features | index("precard-mark-db-preview") // empty' 2>/dev/null || true)"
            if [[ "$actual" == "${EXPECTED_VERSION}.0" && -n "$readable" && -n "$preview" ]] && grep -q 'full-runner-initial-comparison' <<<"$health" && grep -q 'アイルランドTの初期印・仮比較' <<<"$html" && grep -q '/v1/lab/mark-comparison' <<<"$html" && grep -q 'DBで仮比較' <<<"$html" && grep -q '想定馬・馬番未確定' <<<"$html" && grep -q 'JRA想定馬情報を更新して仮比較' <<<"$html" && grep -q 'resultBlindReplay' <<<"$html" && grep -q '/v1/lab/replay' <<<"$html" && grep -q '実際の上位3頭' <<<"$html" && grep -q '完走馬の上がり3F' <<<"$html" && grep -q ':focus-visible' <<<"$html"; then
              echo "Production browser is serving APP v${EXPECTED_VERSION}.0 with readable replay results"
              exit 0
            fi
            sleep 5
          done
          echo "Production browser did not converge to APP v${EXPECTED_VERSION}.0" >&2
          printf '%s\n' "$last" | tail -c 2000 >&2
          exit 1
      - name: Verify API connectivity contract is visible
        shell: bash
        run: |
          set -euo pipefail
          html="$(curl -fsS --max-time 10 "$PRODUCTION_URL/")"
          grep -q '/v1/lab/deploy-check' <<<"$html"
          grep -q '本番API接続 OK' <<<"$html"
