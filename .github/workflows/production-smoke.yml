name: App production smoke

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: app-production-smoke
  cancel-in-progress: true

env:
  PRODUCTION_URL: https://keiba-lab-apl.vercel.app

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Resolve expected app version
        id: expected
        shell: bash
        run: |
          set -euo pipefail
          entry="$(node - <<'NODE'
          const fs=require('fs');
          const x=fs.readFileSync('wrangler.jsonc','utf8');
          const m=x.match(/"main"\s*:\s*"src\/index-v([^"]+)\.js"/);
          if(!m)process.exit(2);
          const source=fs.readFileSync('src/index-v'+m[1]+'.js','utf8');
          const version=source.match(/VERSION=['"]([^'"]+)['"]/);
          if(!version)process.exit(2);
          process.stdout.write(version[1]);
          NODE
          )"
          echo "version=$entry" >> "$GITHUB_OUTPUT"
      - name: Verify deployed browser root
        shell: bash
        env:
          EXPECTED_VERSION: ${{ steps.expected.outputs.version }}
        run: |
          set -euo pipefail
          last=''
          for attempt in $(seq 1 24); do
            health="$(curl -fsS --max-time 10 "$PRODUCTION_URL/health" 2>/dev/null || true)"
            html="$(curl -fsS --max-time 10 "$PRODUCTION_URL/" 2>/dev/null || true)"
            last="$health"
            actual="$(printf '%s' "$health" | jq -r '.version // empty' 2>/dev/null || true)"
            readable="$(printf '%s' "$health" | jq -r '.features | index("touch-friendly-global-styles") // empty' 2>/dev/null || true)"
            preview="$(printf '%s' "$health" | jq -r '.features | index("precard-mark-db-preview") // empty' 2>/dev/null || true)"
            if [[ "$actual" == "${EXPECTED_VERSION}" && -n "$readable" && -n "$preview" ]] && grep -q 'expected-history-coverage-visible' <<<"$health" && grep -q 'historyCoverage' <<<"$html" && grep -q 'formal-card-gate-visible' <<<"$health" && grep -q 'phaseGate' <<<"$html" && grep -q 'phase-draft-carryover' <<<"$health" && grep -q 'carryMarkDraft' <<<"$html" && grep -q 'vertical-runner-comparison-cards' <<<"$health" && grep -q 'labo-pool-card' <<<"$html" && grep -q 'expected-roster-inline-marks' <<<"$health" && grep -q 'expectedInlineRoster' <<<"$html" && grep -q 'full-runner-initial-comparison' <<<"$health" && grep -q '対象レースの印・DB比較' <<<"$html" && grep -q 'サウジアラビアRC（10/10）' <<<"$html" && grep -q 'アイルランドT（10/11）' <<<"$html" && grep -q 'saudi-rc-selectable' <<<"$health" && grep -q 'formation-ticket-builder-8-types' <<<"$health" && grep -q 'readable-mark-audit-cards' <<<"$health" && grep -q 'same-origin-mark-audit-proxy' <<<"$health" && grep -q 'laboAuditReport' <<<"$html" && grep -q 'audit-readable-horse' <<<"$html" && grep -q 'renderMarkAuditCards' <<<"$html" && grep -q 'ticketGroups' <<<"$html" && grep -q 'ticketSlipItems' <<<"$html" && grep -q 'ticketFromMarks' <<<"$html" && grep -q 'ticketBudget' <<<"$html" && grep -q '/v1/lab/mark-comparison' <<<"$html" && grep -q 'DBで仮比較' <<<"$html" && grep -q '想定馬・馬番未確定' <<<"$html" && grep -q 'JRA想定馬情報を更新して仮比較' <<<"$html" && grep -q 'resultBlindReplay' <<<"$html" && grep -q '/v1/lab/replay' <<<"$html" && grep -q '実際の上位3頭' <<<"$html" && grep -q '完走馬の上がり3F' <<<"$html" && grep -q ':focus-visible' <<<"$html"; then
              echo "Production browser is serving APP v${EXPECTED_VERSION} with readable replay results"
              exit 0
            fi
            sleep 5
          done
          echo "Production browser did not converge to APP v${EXPECTED_VERSION}" >&2
          printf '%s\n' "$last" | tail -c 2000 >&2
          exit 1
      - name: Verify API connectivity contract is visible
        shell: bash
        run: |
          set -euo pipefail
          html="$(curl -fsS --max-time 10 "$PRODUCTION_URL/")"
          grep -q '/v1/lab/deploy-check' <<<"$html"
          grep -q '本番API接続 OK' <<<"$html"

      - name: Verify same-origin mark audit POST (read-only)
        shell: bash
        env:
          LAB_API: https://keiba-lab-api.sekai-no-bancyou.workers.dev
        run: |
          set -euo pipefail
          card="$(curl -fsS --max-time 15 -G "$LAB_API/api/jra/runners" --data-urlencode 'race_key=2026-10-11:東京:11')"
          horse="$(printf '%s' "$card" | jq -r '.data[0].horse_name // .data[0].horseName // empty')"
          if [[ -z "$horse" ]]; then echo 'Verified JRA runner is unavailable' >&2; exit 1; fi
          body="$(jq -cn --arg horse "$horse" '{date:"2026-10-11",venue:"東京",raceNo:11,phase:"post_draw",marks:[{horseName:$horse,mark:"◎"}]}')"
          response="$(curl -fsS --retry 2 --retry-delay 2 --retry-all-errors --max-time 35 -X POST \
            "$PRODUCTION_URL/v1/lab/user-mark-audit" -H 'content-type: application/json' -d "$body")"
          if ! printf '%s' "$response" | jq -e '.ok == true and .stage == "user-mark-db-crosscheck" and .audit.mode == "official-card-model-crosscheck" and (.audit.marked|length)==1' >/dev/null; then
            printf '%s\n' "$response" | jq -c '{ok,stage,error,auditMode:.audit.mode}' >&2 || true
            exit 1
          fi
          echo 'Same-origin user-mark-audit proxy returned verified official model audit'

      - name: Diagnose Saudi and Ireland race data (read-only)
        shell: bash
        continue-on-error: true
        env:
          LAB_API: https://keiba-lab-api.sekai-no-bancyou.workers.dev
        run: |
          for race_date in 2026-10-10 2026-10-11; do
            echo "Race status check: $race_date Tokyo 11R"
            ops="$(curl -sSG --max-time 15 "$LAB_API/v1/lab/race-ops" --data-urlencode "date=$race_date" --data-urlencode "venue=東京" --data-urlencode "race_no=11" || echo '{}')"
            card="$(curl -sSG --max-time 15 "$LAB_API/api/jra/runners" --data-urlencode "race_key=$race_date:東京:11" || echo '{}')"
            expect="$(curl -sSG --max-time 15 "$LAB_API/v1/lab/expected-runners" --data-urlencode "date=$race_date" --data-urlencode "venue=東京" --data-urlencode "race_no=11" || echo '{}')"
            printf '%s\n' "$ops" | jq -c '{ok, officialComplete: .ops.cardComplete, nextAction: .ops.nextAction, error}' || true
            printf '%s\n' "$card" | jq -c '{ok, officialRows: .count, error}' || true
            printf '%s\n' "$expect" | jq -c '{ok, expectedRows: (.runners|length), error}' || true
          done
